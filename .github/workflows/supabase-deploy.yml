name: Deploy Supabase Changes

# يعمل هذا السكريبت تلقائياً عند رفع أي كود جديد (push) إلى الفرع الرئيسي main
on:
  push:
    branches:
      - main
  # يسمح لك أيضاً بتشغيله يدوياً من علامة التبويب Actions في GitHub متى شئت
  workflow_dispatch:

jobs:
  supabase-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. سحب واستنساخ كود المشروع من المستودع
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. إعداد وتثبيت أداة Supabase CLI في بيئة التشغيل
      - name: Setup Supabase CLI
        uses: supabase/setup-supabase@v1

      # 3. ربط المشروع وتنفيذ التعديلات (Migrations) على قاعدة بيانات Supabase باستخدام الأسرار المخزنة
      - name: Deploy to Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          supabase db push --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
