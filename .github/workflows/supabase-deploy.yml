name: Deploy Supabase Changes

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  supabase-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. سحب كود المشروع
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. تثبيت Node.js (مطلوب لتشغيل Supabase CLI)
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. تثبيت Supabase CLI عالمياً بشكل مباشر
      - name: Install Supabase CLI
        run: npm install -g supabase

      # 4. تنفيذ الأوامر على Supabase باستخدام الأسرار
      - name: Deploy to Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          supabase db push --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
